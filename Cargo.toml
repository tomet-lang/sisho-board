[workspace]
resolver = "3"
members = [
  "app",
  "crates/sisho-board-config",
  "crates/sisho-board-core",
  "crates/sisho-board-health",
  "crates/sisho-board-run",
  "crates/sisho-board-sdk",
  "crates/sisho-board-tui",
]

default-members = ["app"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"

[workspace.dependencies]
sisho-board-config = { path = "crates/sisho-board-config" }
sisho-board-core   = { path = "crates/sisho-board-core" }
sisho-board-health = { path = "crates/sisho-board-health" }
sisho-board-run    = { path = "crates/sisho-board-run" }
sisho-board-sdk    = { path = "crates/sisho-board-sdk" }
sisho-board-tui    = { path = "crates/sisho-board-tui" }
#--- Sisho ---
jobserver-gate = { git = "https://github.com/tomet-lang/jobserver-gate.git" }
sisho-sdk      = { git = "https://github.com/tomet-lang/sisho.git" }
sisho-tui      = { git = "https://github.com/tomet-lang/sisho.git" }
#--- Crates.io ---
anyhow     = "1"
clap       = { version = "4.6", features = ["derive"] }
crossterm  = "0.28"
jobserver  = "0.1"
ratatui    = "0.29"
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true

[profile.dev.package."*"]
opt-level = 3
